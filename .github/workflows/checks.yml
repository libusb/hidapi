name: Checks
run-name: Code checks for '${{ github.ref_name }}'

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 0'

permissions:
  contents: read

# Coverity Scan has one snapshot history for this project. Serialize submissions
# across branches, while allowing the three native captures to run in parallel.
concurrency:
  group: coverity-scan
  cancel-in-progress: false

jobs:
  coverity-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: src
    - name: Setup MSVC
      uses: TheMrMilchmann/setup-msvc-dev@v2.0.0
      with:
        arch: x64
    - uses: ./src/.coverity/setup
      timeout-minutes: 15
      with:
        platform: win64
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
    - name: Configure
      timeout-minutes: 5
      run: cmake -B build -S src -G"NMake Makefiles" -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHIDAPI_WITH_TESTS=ON -DHIDAPI_BUILD_HIDTEST=ON
    - name: Capture Windows
      timeout-minutes: 10
      working-directory: build
      run: |
        cov-configure --msvc
        if ($LASTEXITCODE -ne 0) { throw 'cov-configure failed' }
        cov-build --dir cov-int nmake
        if ($LASTEXITCODE -ne 0) { throw 'cov-build failed' }
        cov-manage-emit --ident > coverity-version.txt
        if ($LASTEXITCODE -ne 0) { throw 'cov-manage-emit failed' }
        tar -czf ../coverity-windows.tar.gz cov-int coverity-version.txt
        if ($LASTEXITCODE -ne 0) { throw 'tar failed' }
    - uses: actions/upload-artifact@v4
      with:
        name: coverity-windows
        path: coverity-windows.tar.gz
        if-no-files-found: error
        retention-days: 7

  coverity-macos:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: src
    - uses: ./src/.coverity/setup
      timeout-minutes: 15
      with:
        platform: Darwin
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
    - name: Install dependencies
      timeout-minutes: 10
      run: brew install ninja
    - name: Configure
      timeout-minutes: 5
      run: cmake -B build -S src -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHIDAPI_WITH_TESTS=ON -DHIDAPI_BUILD_HIDTEST=ON -DCMAKE_C_COMPILER=clang
    - name: Capture macOS
      timeout-minutes: 10
      working-directory: build
      run: |
        cov-configure --clang
        cov-build --dir cov-int ninja
        cov-manage-emit --ident > coverity-version.txt
        tar -czf ../coverity-macos.tar.gz cov-int coverity-version.txt
    - uses: actions/upload-artifact@v4
      with:
        name: coverity-macos
        path: coverity-macos.tar.gz
        if-no-files-found: error
        retention-days: 7

  coverity-linux:
    # Keep the compiler within the range understood by the Scan capture tools.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: src
    - uses: ./src/.coverity/setup
      timeout-minutes: 15
      with:
        platform: linux64
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
    - name: Install dependencies
      timeout-minutes: 10
      run: |
        sudo apt update
        sudo apt install -y libudev-dev libusb-1.0-0-dev ninja-build gcc-13
    - name: Configure
      timeout-minutes: 5
      run: cmake -B build -S src -GNinja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHIDAPI_WITH_TESTS=ON -DHIDAPI_BUILD_HIDTEST=ON -DCMAKE_C_COMPILER=gcc-13 -DCMAKE_C_STANDARD=11
    - name: Capture Linux backends
      timeout-minutes: 10
      working-directory: build
      run: |
        cov-configure --template --compiler gcc-13 --comptype gcc
        cov-build --dir cov-int ninja
        cov-manage-emit --ident > coverity-version.txt
        tar -czf ../coverity-linux.tar.gz cov-int coverity-version.txt
    - uses: actions/upload-artifact@v4
      with:
        name: coverity-linux
        path: coverity-linux.tar.gz
        if-no-files-found: error
        retention-days: 7

  coverity-submit:
    needs: [coverity-windows, coverity-macos, coverity-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        path: src
    - uses: ./src/.coverity/setup
      timeout-minutes: 15
      with:
        platform: linux64
        token: ${{ secrets.COVERITY_SCAN_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        pattern: coverity-*
        path: captures
    - name: Merge and validate captures
      timeout-minutes: 10
      run: |
        python3 -B src/.coverity/test_merge.py
        for platform in windows macos linux; do
          tar -xzf "captures/coverity-$platform/coverity-$platform.tar.gz" -C "captures/coverity-$platform"
        done
        python3 src/.coverity/merge.py captures cov-int
        tar -czf cov-int.tar.gz cov-int
    - name: Archive merged capture
      uses: actions/upload-artifact@v4
      with:
        name: coverity-combined
        path: |
          cov-int.tar.gz
          coverity-merge.json
        if-no-files-found: error
        retention-days: 7
    - name: Submit results to Coverity Scan
      timeout-minutes: 10
      env:
        COVERITY_SCAN_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        COVERITY_SCAN_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
      run: |
        curl --fail-with-body --silent --show-error --connect-timeout 30 --max-time 540 \
          --output coverity-submit-response.txt \
          --form-string "token=$COVERITY_SCAN_TOKEN" \
          --form-string "email=$COVERITY_SCAN_EMAIL" \
          --form file=@cov-int.tar.gz \
          --form-string "version=$GITHUB_SHA" \
          --form-string "description=Independent Windows, macOS and Linux captures" \
          https://scan.coverity.com/builds?project=hidapi
        cat coverity-submit-response.txt
        grep -Eq '^Build successfully submitted\.[[:space:]]*$' coverity-submit-response.txt
